<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>KitsuneAoi — a gem matching game</title>

    <!-- Split CSS: model = per-gem visuals, design = page/board layout + fonts,
     animation = selection + swap effects -->
    <link rel="stylesheet" href="css/animation/select.css" />
    <link rel="stylesheet" href="css/animation/swap.css" />
    <link rel="stylesheet" href="css/design/layout.css" />
    <link rel="stylesheet" href="css/design/typography.css" />
    <link rel="stylesheet" href="css/design/dialog.css" />
    <link rel="stylesheet" href="css/model/gems.css" />
  </head>
  <body>
    <!-- Side stats panel — fixed to the left edge of the viewport, so it
     doesn't disturb the existing centered flex-column layout used by
     everything else. Populated by main.js's renderSideStats(), which
     only needs to run on init() and again right after a boon is
     applied — those are the only two things that can change any
     number shown here. -->
    <div id="side-stats" class="side-stats">
      <h2>Gem Stats</h2>

      <div class="side-stats-global">
        <div class="side-stat-row">
          <span class="side-stat-label">Global Multiplier</span>
          <span class="side-stat-value" id="global-multiplier">1.00x</span>
        </div>
        <div class="side-stat-row">
          <span class="side-stat-label">Global Bonus</span>
          <span class="side-stat-value" id="global-bonus">+0</span>
        </div>
      </div>
      <div id="gem-stats-list" class="gem-stats-list"></div>
    </div>
    <!-- NEW — right-side History panel, mirrors #side-stats on the
     left. Populated by main.js's renderHistoryPanel(), called every
     time a new entry is pushed via history.js's addHistoryEntry(). -->
    <div id="history-panel" class="history-panel">
      <h2>History</h2>
      <div id="history-list" class="history-list"></div>
    </div>
    <!-- Placeholder text below — main.js overwrites this on load from
     resources/constants.js, so that file is the real source of truth. -->
    <div class="masthead">
      <h1>Seam</h1>
      <p>trace three of a kind along the fault line</p>
    </div>

    <!-- Shown on load, and again whenever the player returns from a
     lost run. Hidden as soon as "Start Game" is clicked. -->
    <div id="start-screen" class="start-screen">
      <button id="start-game" class="start-button">Start Game</button>
    </div>

    <!-- Everything the actual game needs on screen. Hidden until
     "Start Game" is clicked; toggled off again on a loss. -->
    <div id="game-container" class="hidden">
      <div class="stats">
        <div class="stat">
          <div class="n" id="level">1</div>
          <div class="l">LEVEL</div>
        </div>
        <div class="stat">
          <div class="n" id="score">0</div>
          <div class="l">SCORE</div>
        </div>
        <div class="stat" id="moves-stat">
          <div class="n" id="moves">30</div>
          <div class="l">MOVES LEFT</div>
        </div>
        <div class="stat">
          <div class="n" id="target">0</div>
          <div class="l">TARGET</div>
        </div>
      </div>

    <!-- board-wrap exists purely so the score popup can be positioned
        absolutely relative to the board, above it — #board itself gets
        its innerHTML wiped on every renderBoard() call, so the popup
        can't live INSIDE #board or it'd get erased every redraw. -->
    <div id="board-wrap" class="board-wrap">
      <div id="score-popup" class="score-popup"></div>
      <div id="board"></div>
    </div>
    <div id="message">select a gem, then an adjacent one to swap</div>
      <!-- Placeholder text below — main.js overwrites this on load from
      resources/constant/text.js (BUTTONS.RESET). -->
      <button id="reset">start over</button>
    </div>

    <!-- Placeholder text below — main.js overwrites this on load from
    resources/constant/text.js (DIALOG_TITLES.*, BUTTONS.*). -->
    <div id="lose-dialog" class="dialog-overlay hidden">
      <div class="dialog-box">
        <h2 id="lose-title">Out of moves</h2>
        <p id="lose-message"></p>
        <button id="lose-restart">start over</button>
      </div>
    </div>

    <div id="levelup-dialog" class="dialog-overlay hidden">
      <div class="dialog-box">
        <h2 id="levelup-title">Level Cleared!</h2>
        <button id="levelup-next">Next Level</button>
      </div>
    </div>

    <div id="boon-dialog" class="dialog-overlay hidden">
      <div class="dialog-box boon-dialog-box">
        <h2 id="boon-title">Choose a Boon</h2>
        <div id="boon-choices" class="boon-choices"></div>
      </div>
    </div>
    <div id="shop-dialog" class="dialog-overlay hidden">
      <div class="dialog-box shop-dialog-box">
        <h2 id="shop-title">The Shop</h2>
        <p id="shop-subtitle"></p>
        <div id="shop-choices" class="shop-choices"></div>
        <button id="shop-leave">Leave</button>
      </div>
    </div>
    <!-- Placeholder text below — main.js overwrites this on load
     from resources/constant/text.js's GAME_VERSION. -->
    <div id="version-tag" class="version-tag">v0.0.0</div>
    <script type="module" src="js/gameplay/main.js"></script>
  </body>
</html>
