<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="aquaBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafcfa"/>
      <stop offset="45%" stop-color="#9fe8e0"/>
      <stop offset="100%" stop-color="#4fb8b0"/>
    </linearGradient>
    <linearGradient id="aquaFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7fd6cd"/>
    </linearGradient>
  </defs>

  <!-- emerald/step-cut octagon outline -->
  <polygon points="30,10 70,10 88,28 88,72 70,90 30,90 12,72 12,28"
           fill="url(#aquaBody)" stroke="#3a9c93" stroke-width="1.5"/>

  <!-- step facets -->
  <rect x="24" y="24" width="52" height="52" fill="url(#aquaFacet)" opacity="0.55"/>
  <rect x="34" y="34" width="32" height="32" fill="#ffffff" opacity="0.5"/>

  <!-- crown edge facets -->
  <polygon points="30,10 70,10 62,24 38,24" fill="#ffffff" opacity="0.6"/>
  <polygon points="12,28 24,24 24,76 12,72" fill="#2f8a82" opacity="0.35"/>
  <polygon points="88,28 76,24 76,76 88,72" fill="#ffffff" opacity="0.3"/>
  <polygon points="30,90 70,90 62,76 38,76" fill="#2f8a82" opacity="0.3"/>
</svg>
