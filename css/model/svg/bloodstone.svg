<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bloodBody" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#4a7a4f"/>
      <stop offset="55%" stop-color="#204d29"/>
      <stop offset="100%" stop-color="#0f2a15"/>
    </radialGradient>
  </defs>

  <!-- cabochon dome -->
  <ellipse cx="50" cy="54" rx="40" ry="34" fill="url(#bloodBody)" stroke="#0a1f0e" stroke-width="1.5"/>

  <!-- gloss highlight -->
  <ellipse cx="36" cy="34" rx="14" ry="9" fill="#ffffff" opacity="0.35"/>

  <!-- red/orange flecks — the "blood" in bloodstone -->
  <circle cx="40" cy="52" r="3"   fill="#c23b2e"/>
  <circle cx="60" cy="66" r="2.4" fill="#d9542f"/>
  <circle cx="66" cy="42" r="2"   fill="#b8321f"/>
  <circle cx="48" cy="70" r="1.8" fill="#c23b2e"/>
  <circle cx="30" cy="60" r="1.6" fill="#d9542f"/>
  <circle cx="58" cy="50" r="1.4" fill="#b8321f"/>
</svg>
