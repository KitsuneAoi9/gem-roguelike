<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    OBSIDIAN — a faceted, dark crystal look (classic "diamond cut"
    silhouette), so it reads clearly as "a gem" among the other gem
    art, just entirely black/near-black instead of colored. Five
    facets, each a slightly different near-black shade for depth, plus
    a small glossy highlight near the top so it doesn't read as a flat
    silhouette.
  -->

  <!-- outer silhouette (fallback fill, mostly covered by the facets below) -->
  <polygon points="30,18 70,18 92,40 50,92 8,40" fill="#0c0a0d"/>

  <!-- top "table" facet — lightest, catches the most light -->
  <polygon points="30,18 70,18 50,45" fill="#4a434c"/>

  <!-- upper-left facet -->
  <polygon points="30,18 50,45 8,40" fill="#2a242b"/>

  <!-- upper-right facet -->
  <polygon points="70,18 92,40 50,45" fill="#241f26"/>

  <!-- lower-left facet -->
  <polygon points="8,40 50,45 50,92" fill="#171319"/>

  <!-- lower-right facet — darkest, in "shadow" -->
  <polygon points="92,40 50,92 50,45" fill="#0f0c11"/>

  <!-- small glossy highlight streak -->
  <polygon points="34,22 46,22 40,30" fill="#ffffff" opacity="0.18"/>
</svg>
