<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="onyxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3d"/>
      <stop offset="55%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="onyxFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c5c60"/>
      <stop offset="100%" stop-color="#2a2a2d"/>
    </linearGradient>
  </defs>

  <!-- outer cut outline -->
  <polygon points="50,6 78,24 90,52 68,90 32,90 10,52 22,24"
           fill="url(#onyxBody)" stroke="#000000" stroke-width="1.5"/>

  <!-- crown facets -->
  <polygon points="50,6 78,24 63,40 50,34 37,40 22,24" fill="url(#onyxFacetLight)" opacity="0.75"/>
  <polygon points="10,52 22,24 37,40 32,58" fill="#000000" opacity="0.35"/>
  <polygon points="90,52 78,24 63,40 68,58" fill="#4a4a4e" opacity="0.4"/>
  <polygon points="32,90 68,90 68,58 50,70 32,58" fill="#000000" opacity="0.3"/>

  <!-- table facet -->
  <polygon points="50,34 63,40 68,58 50,70 32,58 37,40" fill="url(#onyxBody)" stroke="#000000" stroke-width="0.6"/>

  <!-- subtle sheen -->
  <polygon points="42,20 58,20 52,30 44,28" fill="#8a8a90" opacity="0.35"/>
</svg>
